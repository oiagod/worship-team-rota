<!DOCTYPE html>
<html lang="en">
<head>
    {% block head %}
    <link rel="stylesheet" href="style.css" />
    <title>{% block title %}{% endblock %} - My Webpage</title>
    <style>
            body {
                font-family: Arial, sans-serif;
                background-color: #f4f4f9;
                display: flex;
                justify-content: center;
                align-items: center;
                height: 100vh;
                margin: 0;
            }
            .form-container {
                background: #ffffff;
                padding: 30px;
                border-radius: 8px;
                box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
                width: 100%;
                max-width: 400px;
            }
            h2 {
                margin-bottom: 20px;
                font-size: 24px;
                color: #333;
            }
            .form-group {
                margin-bottom: 15px;
            }
            label {
                display: block;
                margin-bottom: 5px;
                font-weight: bold;
                color: #555;
            }
            input[type="text"],
            input[type="email"] {
                width: 100%;
                padding: 10px;
                border: 1px solid #ccc;
                border-radius: 4px;
                box-sizing: border-box;
                font-size: 16px;
            }
            input:focus {
                border-color: #007BFF;
                outline: none;
            }
            button {
                width: 100%;
                padding: 12px;
                background-color: #007BFF;
                color: white;
                border: none;
                border-radius: 4px;
                font-size: 16px;
                cursor: pointer;
                transition: background 0.2s;
            }
            button:hover {
                background-color: #0056b3;
            }
        </style>
    {% endblock %}
</head>
<body>
    <div id="content">
        {% block content %}
        <div class="form-container">
            <h2>Alterar os dados?</h2>
                <form action="/update_user/{{user.id}}" method="POST">
                    <div class="form-group">
                        <label for="username">Usuário</label>
                        <input type="text" id="username" name="username" value="{{user.username}}" required>
                    </div>
                    <div class="form-group">
                        <label for="email">E-mail</label>
                        <input type="email" id="email" name="email" value="{{user.email}}" required>
                    </div>
                    <button type="submit" id="saveBtn">Salvar</button>
                </form>
                <form action="/delete_user/{{user.id}}" method="POST">
                    <button type="submit" id="deleteBtn">Deletar</button>
                </form>
            </div>
        </div>
        {% endblock %}
    </div>
</body>

    <script>
        const save_button = document.getElementById("saveBtn");
        const delete_button = document.getElementById("deleteBtn");

        save_button.addEventListener('click', function(event) {
            const userConfirmed = confirm("Tem certeza que deseja salvar as alterações?");

            if (!userConfirmed) {
                event.preventDefault();
            } else {
                alert("Alterações salvas com sucesso")
            }
        });

        delete_button.addEventListener('click', function(event) {
            const userConfirmed = confirm("Tem certeza que deseja deletar?");

            if (!userConfirmed) {
                event.preventDefault();
            } else {
                alert("Usuário deletado com sucesso")
            }
        });
    </script>
</html>
